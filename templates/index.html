<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="阅境——跨书源小说聚合阅读器，支持搜索、收藏、文本与漫画阅读，东方美学界面">
<title>阅境 · 小说阅读器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="/static/vendor/fonts.css">
<link rel="stylesheet" href="/static/css/style.css">
<!-- Motion One import map（本地离线） -->
<script type="importmap">
{ "imports": { "motion": "/static/vendor/motion.min.js" } }
</script>
<!-- 关键加载顺序（全部 defer，按文档顺序执行）：
     1. app.js 必须先跑 —— 它会调用 Alpine.data('appState', ...) 注册组件工厂；
        但此时 Alpine 还没加载，怎么调？答：app.js 把注册函数挂到 window，
        等 Alpine 加载后由 alpine.min.js 之后的 alpine-bootstrap.js 拿来调。
     不行。换个方案：手动 polyfill window.Alpine = { data: queueRegister } 占位，
     等真 Alpine 加载完取出队列重放。最干净。 -->
<script>
  // 拦截 Alpine 自动 start：alpine.min.js 末尾用 queueMicrotask(Alpine.start) 自启，
  // 但因为 defer 脚本之间会清微任务队列，alpine 加载完立刻 start，赶在 app.js 之前
  // → 模板里 x-data="appState" 全部 ReferenceError。
  // 方案：alpine.min.js 已被人工补丁屏蔽末尾的 Alpine.start()，由 app.js 手动启动。
  // 这里只占位 Alpine.data() 队列：让 app.js 注册的 appState 等 alpine 加载完重放。
  (function () {
    const dataQueue = [];
    let realAlpine = null;
    Object.defineProperty(window, 'Alpine', {
      configurable: true,
      get() {
        if (realAlpine) return realAlpine;
        return { data: (n, f) => dataQueue.push([n, f]), reactive: (o) => o };
      },
      set(v) {
        realAlpine = v;
        // 重放排队的 data() 注册
        dataQueue.forEach(([n, f]) => realAlpine.data(n, f));
      },
    });
  })();
</script>
<!-- Alpine.js（本地离线） -->
<script defer src="/static/vendor/alpinejs.min.js"></script>
<!-- Iconify Web Component（本地离线，SVG 图标按需加载） -->
<script defer src="/static/vendor/iconify-icon.min.js"></script>
</head>
<body x-data="appState" @keydown.escape="closeSettings()">

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" :class="{ 'show': sidebarOpen }">
    <div class="sidebar-header">
      <h1>阅 · 境</h1>
      <p id="sourceCount">加载中...</p>
    </div>
    <nav class="sidebar-nav">
      <button :class="{ 'active': sidebarTab === 'shelf' }" @click="sidebarTab = 'shelf'" aria-label="书架"><iconify-icon icon="ph:book-open-text" inline></iconify-icon>书架</button>
      <button :class="{ 'active': sidebarTab === 'sources' }" @click="sidebarTab = 'sources'" aria-label="源管理"><iconify-icon icon="ph:gear-six" inline></iconify-icon>源管理</button>
    </nav>
    <div class="sidebar-content">
      <div id="shelfPanel" class="sidebar-section" x-show="sidebarTab === 'shelf'">
        <h3 x-show="!shelf.length" style="display:none">我的书架</h3>
        <!-- 空态 -->
        <div class="empty" style="padding:20px" x-show="!shelf.length">
          <p>书架空空如也</p>
        </div>
        <!-- 书架项 x-for -->
        <template x-for="b in shelf" :key="b.source_url + b.book_url">
          <div class="shelf-item" @click="openBook(b)">
            <div class="cover" x-html="shelfCoverHTML(b)"></div>
            <div class="info">
              <div class="name" x-text="b.name"></div>
              <div class="author" x-text="b.author || ''"></div>
              <div class="progress-badge" x-show="shelfProgressHTML(b)" x-html="shelfProgressHTML(b)"></div>
            </div>
          </div>
        </template>
      </div>
      <div id="sourcesPanel" class="sidebar-section" x-show="sidebarTab === 'sources'">
        <!-- 统计 -->
        <div id="sourcesPanelStats" style="margin-bottom:10px;font-size:12px"></div>
        <!-- 控件 -->
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input type="text" x-model="sourceFilterQuery" placeholder="筛选源..."
            style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px">
          <button class="btn btn-outline" style="white-space:nowrap;font-size:12px"
            :class="{ active: sourceFlaggedOnly }" @click="toggleFlaggedFilter()" title="只显示已标记源">
            <iconify-icon icon="ph:flag" inline></iconify-icon>
          </button>
          <button class="btn btn-outline" style="white-space:nowrap;font-size:12px" @click="runHealthCheck()" title="检测源可用性">
            <iconify-icon icon="ph:magnifying-glass" inline></iconify-icon> 检测
          </button>
        </div>
        <!-- 一键禁用失效源 -->
        <button class="btn btn-outline" x-show="sourceDeadCount > 0"
          style="width:100%;margin-bottom:12px;color:var(--red);border-color:var(--red);font-size:12px"
          @click="batchDisableDead()">
          <iconify-icon icon="ph:warning" inline></iconify-icon> 一键禁用 <span x-text="sourceDeadCount"></span> 个失效源
        </button>
        <!-- 源列表（分组 x-for） -->
        <template x-for="group in groupedSources" :key="group.name">
          <div>
            <h3 style="margin:12px 0 8px;font-size:13px;color:var(--muted)" x-text="group.name + '（' + group.items.length + '）'"></h3>
            <template x-for="s in group.items" :key="s.url">
              <div class="source-item" :class="{ flagged: s.flagged }" :title="sourceStatusTitle(s)">
                <span class="dot" :class="sourceDotClass(s)"></span>
                <span class="name" @click.stop="toggleSource(s.url)" x-text="s.name"></span>
                <span class="badge" x-text="s.type"></span>
                <span class="flag-btn" @click.stop="flagSource(s.url)" :title="sourceFlagTitle(s)" x-html="sourceFlagIcon(s)"></span>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar" id="topbar">
      <button class="menu-btn" @click="sidebarOpen = !sidebarOpen" aria-label="菜单"><iconify-icon icon="ph:list" inline></iconify-icon></button>
      <div class="search-box">
        <span class="icon"><iconify-icon icon="ph:magnifying-glass" inline></iconify-icon></span>
        <input type="search" id="searchInput" placeholder="搜索小说..." @keydown.enter="doSearch()" aria-label="搜索小说">
      </div>
      <div class="nav-btns">
        <button @click="sidebarOpen=true;sidebarTab='sources'" title="源管理" style="font-size:12px">
          <iconify-icon icon="ph:gear-six" inline></iconify-icon> 源
        </button>
        <button @click="runHealthCheck()" title="检测源可用性" style="font-size:12px">
          <iconify-icon icon="ph:magnifying-glass" inline></iconify-icon> 检测
        </button>
        <button @click="openSettings()" title="阅读设置" style="font-size:12px">
          <iconify-icon icon="ph:text-aa" inline></iconify-icon>
        </button>
        <button @click="showHome()">首页</button>
        <button @click="goBack()">← 返回</button>
      </div>
    </div>

    <div class="content" id="content">
      <!-- Home -->
      <div id="homeView" class="view active" x-show="currentView === 'home'"
        x-transition:enter="view-enter-active"
        x-transition:enter-start="view-enter-from"
        x-transition:enter-end="view-enter-to"
        x-transition:leave="view-leave-active"
        x-transition:leave-start="view-leave-from"
        x-transition:leave-end="view-leave-to">
        <div class="hero" id="heroArea">
          <h2 class="hero-title">阅 · 境</h2>
          <p class="hero-subtitle">展开书卷，遇见另一个世界</p>
          <div class="hero-search">
            <input type="search" placeholder="搜索书名、作者..." @keydown.enter="quickSearch($el.value)" aria-label="搜索书名作者">
          </div>
          <div class="hero-tags">
            <span @click="quickSearch('玄幻')">玄幻</span>
            <span @click="quickSearch('言情')">言情</span>
            <span @click="quickSearch('都市')">都市</span>
            <span @click="quickSearch('科幻')">科幻</span>
            <span @click="quickSearch('历史')">历史</span>
          </div>
        </div>
        <div class="section-title"><iconify-icon icon="ph:flame" inline></iconify-icon>书架收藏</div>
        <div id="homeShelf" class="book-grid">
          <!-- 空态 -->
          <div class="empty" x-show="!shelf.length">
            <div class="icon"><iconify-icon icon="ph:book-open-text" inline></iconify-icon></div>
            <p>还没有收藏，搜索一本书试试</p>
          </div>
          <!-- 书卡 x-for -->
          <template x-for="(b, i) in shelf" :key="b.source_url + b.book_url">
            <div @click="openBook(b)" x-html="bookCardHTML(b, i)"></div>
          </template>
        </div>
      </div>

      <!-- Search Results -->
      <div id="searchView" class="view" x-show="currentView === 'search'"
        x-transition:enter="view-enter-active"
        x-transition:enter-start="view-enter-from"
        x-transition:enter-end="view-enter-to"
        x-transition:leave="view-leave-active"
        x-transition:leave-start="view-leave-from"
        x-transition:leave-end="view-leave-to">
        <div class="type-tabs" id="typeTabs">
          <button class="type-tab active" data-type="" @click="setSearchType('', $el)">全部</button>
          <button class="type-tab" data-type="0" @click="setSearchType('0', $el)"><iconify-icon icon="ph:book-open-text" inline></iconify-icon>小说</button>
          <button class="type-tab" data-type="2" @click="setSearchType('2', $el)"><iconify-icon icon="ph:palette" inline></iconify-icon>漫画</button>
        </div>
        <div class="section-title">搜索结果 <span class="count" id="resultCount"></span></div>
        <div id="searchResults" class="book-grid">
          <!-- 搜索中提示 -->
          <div class="empty" x-show="searchResults === null">
            <div class="spinner"></div><p>正在搜索...</p>
          </div>
          <!-- 空态 -->
          <div class="empty" x-show="searchResults !== null && !searchResults.length">
            <div class="icon"><iconify-icon icon="ph:mailbox" inline></iconify-icon></div>
            <p>没有找到相关书籍</p>
          </div>
          <!-- 书卡 x-for -->
          <template x-for="(b, i) in searchResults" :key="b.book_url || i">
            <div @click="openBook(b)" x-html="bookCardHTML(b, i)"></div>
          </template>
        </div>
      </div>

      <!-- Book Detail -->
      <div id="detailView" class="view" x-show="currentView === 'detail'"
        x-transition:enter="view-enter-active"
        x-transition:enter-start="view-enter-from"
        x-transition:enter-end="view-enter-to"
        x-transition:leave="view-leave-active"
        x-transition:leave-start="view-leave-from"
        x-transition:leave-end="view-leave-to">
        <div class="detail-header" id="detailHeader"></div>
        <div class="detail-actions" id="detailActions"></div>
        <div class="chapter-count" id="chapterCount"></div>
        <div class="chapter-list" id="chapterList">
          <!-- 诊断信息（漫画源无章节时） -->
          <div x-show="chapterDiagHTML" x-html="chapterDiagHTML"></div>
          <!-- 章节 x-for -->
          <template x-for="(ch, i) in chapters" :key="ch.url || i">
            <div class="chapter-item"
              :class="{ 'current': isChapterCurrent(i), 'read': isChapterRead(i) }"
              @click="readChapter(i)">
              <span x-text="ch.name"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Reader -->
      <div id="readerView" class="view" x-show="currentView === 'reader'"
        x-transition:enter="view-enter-active"
        x-transition:enter-start="view-enter-from"
        x-transition:enter-end="view-enter-to"
        x-transition:leave="view-leave-active"
        x-transition:leave-start="view-leave-from"
        x-transition:leave-end="view-leave-to">
        <div class="reader-progress"><div class="reader-progress-fill" id="progressFill"></div></div>
        <div class="reader-progress-pct" id="progressPct"></div>
        <div class="reader-wrap">
          <div class="reader-nav">
            <button class="btn btn-outline" id="prevChapter" @click="navChapter(-1)" aria-label="上一章">← 上一章</button>
            <span class="title" id="chapterTitle"></span>
            <button class="btn btn-outline" id="nextChapter" @click="navChapter(1)" aria-label="下一章">下一章 →</button>
          </div>
          <div class="reader-content" id="readerContent" @dblclick="openSettings()"></div>
          <div class="chapter-done" id="chapterDone"><span class="check"><iconify-icon icon="ph:check" inline></iconify-icon></span>本章已读完</div>
          <div class="reader-bottom">
            <button class="btn btn-outline" @click="navChapter(-1)" aria-label="上一章">← 上一章</button>
            <button class="btn btn-outline" @click="showDetail()"><iconify-icon icon="ph:bookmarks" inline></iconify-icon>返回目录</button>
            <button class="btn btn-outline" @click="navChapter(1)" aria-label="下一章">下一章 →</button>
          </div>
        </div>
      </div>

      <!-- Loading -->
      <div id="loadingView" class="view" x-show="currentView === 'loading'"
        x-transition:enter="view-enter-active"
        x-transition:enter-start="view-enter-from"
        x-transition:enter-end="view-enter-to"
        x-transition:leave="view-leave-active"
        x-transition:leave-start="view-leave-from"
        x-transition:leave-end="view-leave-to">
        <div class="loading"><div class="spinner"></div><p id="loadingText">正在搜索...</p></div>
      </div>
    </div>
  </main>
</div>

<!-- Settings Panel (glass bottom sheet) -->
<div class="settings-panel" id="settingsPanel"
  x-show="settingsOpen"
  x-transition:enter="slide-enter-active"
  x-transition:enter-start="slide-enter-from"
  x-transition:enter-end="slide-enter-to"
  x-transition:leave="slide-leave-active"
  x-transition:leave-start="slide-leave-from"
  x-transition:leave-end="slide-leave-to"
  style="display:none"
>
  <div class="handle"></div>
  <h3><iconify-icon icon="ph:gear-six" inline></iconify-icon>阅读设置</h3>
  <label for="fontSizeRange">字号：<span id="fontSizeVal">18</span>px</label>
  <input type="range" id="fontSizeRange" min="14" max="28" value="18" @input="setFontSize($el.value)" aria-label="字号调节">
  <label for="lineHeightRange">行高：<span id="lineHeightVal">2.0</span></label>
  <input type="range" id="lineHeightRange" min="14" max="30" value="20" @input="setLineHeight($el.value)" aria-label="行高调节">
  <label>阅读宽度</label>
  <div class="width-btns theme-btns" id="widthBtns">
    <button data-width="55ch" @click="setReadingWidth('55ch')">窄</button>
    <button data-width="65ch" class="active" @click="setReadingWidth('65ch')">中</button>
    <button data-width="80ch" @click="setReadingWidth('80ch')">宽</button>
  </div>
  <label>段首缩进</label>
  <button id="indentToggle" class="btn btn-outline active" style="width:100%" @click="toggleParagraphIndent()">
    <iconify-icon icon="ph:text-indent" inline></iconify-icon> 段首缩进：<span id="indentState">开</span>
  </button>
  <label for="paraSpacingRange">段间距：<span id="paraSpacingVal">0.8em</span></label>
  <input type="range" id="paraSpacingRange" min="2" max="18" value="8" @input="setParagraphSpacing((Number($el.value)/10).toFixed(1)+'em')" aria-label="段间距调节">
  <label for="fontBtns">字体</label>
  <div class="font-btns theme-btns" id="fontBtns">
    <button data-font="serif" class="active" @click="setFontFamily('serif', $el)">衬线</button>
    <button data-font="sans" @click="setFontFamily('sans', $el)">无衬线</button>
    <button data-font="kai" @click="setFontFamily('kai', $el)">楷体</button>
  </div>
  <label>主题</label>
  <div class="theme-btns">
    <button @click="setTheme('')" data-theme-preview="light">宣纸</button>
    <button @click="setTheme('sepia')" data-theme-preview="sepia">青绿</button>
    <button @click="setTheme('dark')" data-theme-preview="dark">墨韵</button>
  </div>
  <button class="btn btn-outline" style="width:100%;margin-top:12px" @click="closeSettings()">关闭</button>
</div>

<!-- Settings overlay -->
<div class="settings-overlay" id="settingsOverlay"
  x-show="settingsOpen"
  x-transition:enter="fade-enter-active"
  x-transition:enter-start="fade-enter-from"
  x-transition:enter-end="fade-enter-to"
  x-transition:leave="fade-leave-active"
  x-transition:leave-start="fade-leave-from"
  x-transition:leave-end="fade-leave-to"
  style="display:none"
  @click="closeSettings()"
></div>

<!-- Toast container (Alpine-managed) -->
<div class="toast-container" id="toastContainer">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast-item" :class="t.type"
      x-show="t.show"
      x-transition:enter="toast-enter-active"
      x-transition:enter-start="toast-enter-from"
      x-transition:enter-end="toast-enter-to"
      x-transition:leave="toast-leave-active"
      x-transition:leave-start="toast-leave-from"
      x-transition:leave-end="toast-leave-to"
    >
      <span class="toast-icon" x-html="t.icon"></span>
      <span x-text="t.message"></span>
    </div>
  </template>
</div>

<!-- Scripts: 必须 defer —— alpinejs.min.js 是 defer，同步脚本会比它先跑，
     顶层 Alpine.reactive(...) 会拿不到 Alpine 而 ReferenceError → window.State 永远不存在 -->
<script src="/static/js/motion-import.js" type="module"></script>
<script defer src="/static/js/ink-bg.js"></script>
<script defer src="/static/js/app.js"></script>
<script defer src="/static/js/reader.js"></script>
<script defer src="/static/js/comic_reader.js"></script>
<script defer src="/static/js/shelf.js"></script>
<script defer src="/static/js/settings.js"></script>
</body>
</html>
